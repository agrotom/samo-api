services:
  web:
    build:
      context: ./samo-front
      dockerfile: ./Dockerfile
    environment:
      NODE_ENV: production
    container_name: samo-front
    depends_on:
      - backend
    ports:
      - 8080:8080
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    container_name: samo-api
    depends_on:
      - db

  db:
      image: postgres:latest
      ports:
        - "5432:5432"
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: 12345678
      volumes:
        - db_data:/var/lib/postgresql/pgdata/15
      container_name: db_postgresql_container
volumes:
  db_data: